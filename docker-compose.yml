services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stallsheet
      POSTGRES_PASSWORD: stallsheet
      POSTGRES_DB: stallsheet
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stallsheet -d stallsheet"]
      interval: 2s
      timeout: 5s
      retries: 20
